name: Link Check

on:
  schedule:
    # Run on the 1st of each month at 08:00 UTC
    - cron: "0 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check links on starmapper.bruniaux.com
        id: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: >
            --verbose
            --no-progress
            --timeout 30
            --max-retries 3
            --accept 200,206,429
            --exclude "^mailto:"
            --exclude "^https://twitter\\.com"
            --exclude "^https://x\\.com"
            --exclude "^https://linkedin\\.com"
            --exclude "^https://www\\.linkedin\\.com"
            --exclude "^https://localhost"
            https://starmapper.bruniaux.com
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5
        with:
          title: "Broken links detected on starmapper.bruniaux.com"
          content-filepath: ./lychee/out.md
          labels: |
            bug
            broken-links
