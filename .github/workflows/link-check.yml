name: Link Check

on:
  schedule:
    # Run on the 1st of each month at 08:00 UTC
    - cron: "0 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check links on starmapper.bruniaux.com
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >
            --verbose
            --no-progress
            --timeout 30
            --max-retries 3
            --accept 200,206,429
            --exclude "^mailto:"
            --exclude "^https://twitter\\.com"
            --exclude "^https://x\\.com"
            --exclude "^https://linkedin\\.com"
            --exclude "^https://www\\.linkedin\\.com"
            --exclude "^https://localhost"
            --exclude "^https://www\\.npmjs\\.com"
            https://starmapper.bruniaux.com
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find existing broken-links issue
        id: find-issue
        if: steps.lychee.outputs.exit_code != 0
        run: |
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "broken-links" --state open --json number --jq '.[0].number // ""')
          echo "issue-number=$ISSUE" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          issue-number: ${{ steps.find-issue.outputs.issue-number }}
          title: "Broken links detected on starmapper.bruniaux.com"
          content-filepath: ./lychee/out.md
          labels: |
            bug
            broken-links
