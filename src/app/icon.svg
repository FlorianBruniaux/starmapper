<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <clipPath id="globe-clip">
      <circle cx="16" cy="16" r="12.5"/>
    </clipPath>
  </defs>

  <!-- Globe meridians (clipped inside circle) -->
  <g clip-path="url(#globe-clip)" stroke="#58a6ff" stroke-width="1.4" fill="none">
    <!-- Equator -->
    <ellipse cx="16" cy="16" rx="12.5" ry="4.5"/>
    <!-- Vertical meridian -->
    <ellipse cx="16" cy="16" rx="4.5" ry="12.5"/>
    <!-- Top latitude line -->
    <ellipse cx="16" cy="10" rx="10" ry="3.2"/>
    <!-- Bottom latitude line -->
    <ellipse cx="16" cy="22" rx="10" ry="3.2"/>
  </g>

  <!-- Globe outer ring -->
  <circle cx="16" cy="16" r="12.5" stroke="#58a6ff" stroke-width="1.6"/>

  <!-- Star (5-pointed, centered) -->
  <polygon
    points="16,8.5 17.6,13.2 22.6,13.2 18.7,16.2 20.3,20.9 16,17.9 11.7,20.9 13.3,16.2 9.4,13.2 14.4,13.2"
    fill="#f0883e"
  />
</svg>
