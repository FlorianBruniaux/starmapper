<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <clipPath id="gc">
      <circle cx="50" cy="50" r="43"/>
    </clipPath>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Globe grid lines -->
  <g clip-path="url(#gc)" stroke="#58a6ff" stroke-width="3" fill="none">
    <!-- Latitude rings -->
    <ellipse cx="50" cy="28" rx="37" ry="8"/>
    <ellipse cx="50" cy="50" rx="43" ry="10"/>
    <ellipse cx="50" cy="72" rx="37" ry="8"/>
    <!-- Meridian ellipses (symmetric pairs) -->
    <ellipse cx="50" cy="50" rx="11" ry="43"/>
    <ellipse cx="50" cy="50" rx="29" ry="43"/>
  </g>

  <!-- Globe outer ring -->
  <circle cx="50" cy="50" r="43" stroke="#58a6ff" stroke-width="3.5"/>

  <!-- Star -->
  <polygon
    points="50,27 55.6,42.3 71.9,42.9 59,52.9 63.5,68.6 50,59.5 36.5,68.6 41,52.9 28.1,42.9 44.4,42.3"
    fill="#f0883e"
    filter="url(#ds)"
  />
</svg>
