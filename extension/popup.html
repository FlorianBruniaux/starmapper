<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarMapper</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 300px;
        min-height: 160px;
        background: #0d1117;
        color: #f0f6fc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px 10px;
        border-bottom: 1px solid #21262d;
      }

      .header svg { color: #58a6ff; flex-shrink: 0; }

      .header-text {
        font-weight: 600;
        font-size: 14px;
        color: #f0f6fc;
      }

      .section { padding: 10px 14px; }

      .label {
        font-size: 11px;
        color: #8b949e;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
      }

      #current-repo-link {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 6px;
        color: #58a6ff;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        transition: border-color 0.15s, background 0.15s;
      }

      #current-repo-link:hover {
        background: #1c2129;
        border-color: #58a6ff;
      }

      #current-repo-link.no-repo {
        color: #8b949e;
        cursor: default;
        pointer-events: none;
      }

      #current-repo-link.no-repo:hover {
        background: #161b22;
        border-color: #30363d;
      }

      .divider {
        height: 1px;
        background: #21262d;
        margin: 0 14px;
      }

      .search-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      #search-input {
        flex: 1;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 6px;
        color: #f0f6fc;
        font-size: 12px;
        padding: 6px 10px;
        outline: none;
        font-family: inherit;
      }

      #search-input::placeholder { color: #484f58; }

      #search-input:focus {
        border-color: #58a6ff;
        box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.12);
      }

      #search-btn {
        background: #238636;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
        transition: background 0.15s;
      }

      #search-btn:hover { background: #2ea043; }

      .footer {
        padding: 8px 14px;
        border-top: 1px solid #21262d;
        display: flex;
        justify-content: center;
      }

      .footer a {
        font-size: 11px;
        color: #8b949e;
        text-decoration: none;
      }

      .footer a:hover { color: #58a6ff; }
    </style>
  </head>
  <body>
    <div class="header">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/>
      </svg>
      <span class="header-text">StarMapper</span>
    </div>

    <div class="section">
      <div class="label">Current repo</div>
      <a id="current-repo-link" href="#" target="_blank" rel="noopener noreferrer" class="no-repo">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 010-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"/>
        </svg>
        <span id="current-repo-name">Navigate to a GitHub repo</span>
      </a>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="label">Map any repo</div>
      <div class="search-row">
        <input
          id="search-input"
          type="text"
          placeholder="owner/repo or GitHub URL"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="search-btn">Map →</button>
      </div>
    </div>

    <div class="footer">
      <a href="https://starmapper.bruniaux.com" target="_blank" rel="noopener noreferrer">
        starmapper.bruniaux.com
      </a>
    </div>

    <script type="module" src="src/popup.ts"></script>
  </body>
</html>
