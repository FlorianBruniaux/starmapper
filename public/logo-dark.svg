<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" fill="none">
  <defs>
    <clipPath id="gc-logo">
      <circle cx="28" cy="28" r="24"/>
    </clipPath>
    <filter id="ds-logo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="220" height="56" fill="#0d1117"/>

  <!-- Globe grid lines -->
  <g clip-path="url(#gc-logo)" stroke="#58a6ff" stroke-width="1.7" fill="none">
    <ellipse cx="28" cy="16.5" rx="20.5" ry="4.5"/>
    <ellipse cx="28" cy="28" rx="24" ry="5.5"/>
    <ellipse cx="28" cy="39.5" rx="20.5" ry="4.5"/>
    <ellipse cx="28" cy="28" rx="6" ry="24"/>
    <ellipse cx="28" cy="28" rx="16" ry="24"/>
  </g>

  <!-- Globe outer ring -->
  <circle cx="28" cy="28" r="24" stroke="#58a6ff" stroke-width="2"/>

  <!-- Star -->
  <polygon
    points="28,15 30.9,23.5 39.8,23.8 32.9,29.2 35.4,37.8 28,32.8 20.6,37.8 23.1,29.2 16.2,23.8 25.1,23.5"
    fill="#f0883e"
    filter="url(#ds-logo)"
  />

  <!-- Wordmark -->
  <text
    x="62"
    y="35"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="22"
    font-weight="600"
    letter-spacing="-0.4"
    fill="#f0f6fc"
  >StarMapper</text>
</svg>
